version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # The only group dependabot-auto-merge.yml acts on: patch and minor version updates
      # to development dependencies. Runtime dependencies, majors and security updates
      # (never grouped) are left out, so each waits for a person.
      npm-dev-minor:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole group: the codeql-action steps (init, analyze,
      # upload-sarif) must move together, or CodeQL fails the workflow with
      # "Loaded a configuration file for version X, but running version Y".
      # Majors included: a major release the group did not take would split
      # across the three steps again, reopening the mismatch it exists to close.
      # Grouping is all this does; dependabot-auto-merge.yml still leaves every
      # action bump for a person.
      github-actions:
        update-types: [major, minor, patch]
