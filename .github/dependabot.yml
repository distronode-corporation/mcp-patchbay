version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # The only group dependabot-auto-merge.yml acts on: patch and minor version updates
      # to development dependencies. Runtime dependencies, majors and security updates
      # (never grouped) are left out, so each waits for a person.
      npm-dev-minor:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
