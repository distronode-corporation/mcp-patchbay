name: Release

# Fires on a `v*` tag and, in order:
#   guard    refuses a tag whose commit is not on main, or whose name is not
#            "v" + package.json's version, and extracts the release notes;
#   test     the same test matrix as ci.yml, at the tagged commit, without a cache;
#   bundle   builds and validates the Claude Desktop extension bundle (.mcpb) at the tagged
#            commit, and smoke-tests it;
#   npm      publishes mcp-patchbay to npm with provenance, through npm trusted
#            publishing (OIDC, no token), a prerelease version under the `next` dist-tag;
#   registry publishes server.json to the MCP Registry once that npm version is out, signed
#            in with GitHub OIDC (no token);
#   release  attests the bundle (build provenance) and creates the GitHub Release for the tag,
#            with the bundle and the attestation's Sigstore bundle
#            (mcp-patchbay-<version>.mcpb.sigstore.json) attached.
#
# The npm job is OFF until the repository variable NPM_PUBLISH is 'true', which is set
# only once the `mcp-patchbay` package on npm has a trusted publisher naming this
# repository and this file, release.yml, with no environment. Renaming this file or
# adding an environment breaks publishing until that entry is changed to match. While
# NPM_PUBLISH is off, the npm job is skipped and so are the registry and release jobs, so a
# tag never gets a registry entry or a GitHub Release that has no matching npm version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed by the ancestry check below: a shallow clone has no merge base.
          fetch-depth: 0
          # The repository is public, so the fetch below needs no credential.
          persist-credentials: false

      # CI runs on pushes to main and on pull requests, not on tags, so a tag on a commit
      # that never reached main would be released from code main never had.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - name: The tag is "v" + package.json's version
        id: version
        run: |
          set -euo pipefail
          have="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$have" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, package.json's version is $have. Refusing to release."
            exit 1
          fi
          echo "version=$have" >> "$GITHUB_OUTPUT"
          echo "releasing $have"

  # The test matrix of ci.yml, repeated here so a release is tested at exactly the tagged
  # commit. Keep the two in step. No npm cache: a release is never built from a cache.
  test:
    needs: guard
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22, 24]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: write-gate example tests
        run: python -m unittest discover -s examples/write-gate -v

  # The Claude Desktop extension bundle, built at the tagged commit with the pinned MCPB CLI
  # (bundle/build.mjs: `mcpb validate`, then `mcpb pack`), started once as its manifest says
  # (bundle/smoke.mjs), and handed to the release job. ci.yml smoke-tests it on macOS and
  # Windows too.
  bundle:
    name: bundle (.mcpb)
    needs: [guard, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and validate the bundle
        run: node bundle/build.mjs --out "$RUNNER_TEMP/bundle"
      - name: Smoke-test the bundle
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/bundle/mcp-patchbay-$VERSION.mcpb" -d "$RUNNER_TEMP/unpacked"
          node bundle/smoke.mjs "$RUNNER_TEMP/unpacked"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: ${{ runner.temp }}/bundle/mcp-patchbay-${{ needs.guard.outputs.version }}.mcpb
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing: npm exchanges this job's OIDC token for a one-time publish token
  # (npm 11.5.1 or later) and adds the provenance attestation itself. No NPM_TOKEN.
  npm:
    name: npm publish
    needs: [guard, test]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The checkout.
      contents: read
      id-token: write # the OIDC token npm exchanges for the publish and signs the provenance with
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # registry-url as npm's trusted publishing guide has it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Older npm has no trusted publishing and would fail with an authentication error.
      - name: npm supports trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          echo "npm $have"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have predates trusted publishing (11.5.1)."
            exit 1
          fi

      # Asked of the registry without credentials: 404 means not published, 200 means it
      # is, anything else is an answer this job cannot read.
      - name: The version is not on npm yet
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/mcp-patchbay/$VERSION")"
          case "$status" in
            404) echo "mcp-patchbay@$VERSION is not on npm yet" ;;
            200) echo "::error::mcp-patchbay@$VERSION is already on npm. Refusing to publish it again."; exit 1 ;;
            *) echo "::error::the npm registry answered $status for mcp-patchbay@$VERSION"; exit 1 ;;
          esac

      # No build step (plain JavaScript), so the package is the tagged tree, packed once
      # and published as that file. No install, and no lifecycle scripts run.
      - name: Pack the package
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          echo "TGZ=$RUNNER_TEMP/mcp-patchbay-$VERSION.tgz" >> "$GITHUB_ENV"

      # A prerelease version (one with a `-`, such as 0.2.0-rc.1) goes to the `next`
      # dist-tag, so `npx mcp-patchbay` keeps resolving to the latest stable release.
      - name: Publish to npm
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish "$TGZ" --provenance --access public --ignore-scripts --tag "$dist_tag"

  # The MCP Registry entry, io.github.distronode-corporation/mcp-patchbay, from server.json.
  # The registry checks that the npm package's `mcpName` names this server, so this waits
  # until npm serves the new version. `mcp-publisher login github-oidc` exchanges this job's
  # OIDC token for a registry token for the io.github.distronode-corporation namespace; no
  # secret is stored. The binary is the upstream release checked against a pinned SHA-256
  # (keep it equal to ci.yml's server-json job).
  registry:
    name: MCP Registry publish
    needs: [guard, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      id-token: write # the OIDC token mcp-publisher exchanges for a registry token
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: server.json is for this version
        run: |
          set -euo pipefail
          have="$(jq -r .version server.json)"
          pkg="$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json)"
          if [ "$have" != "$VERSION" ] || [ "$pkg" != "$VERSION" ]; then
            echo "::error::server.json says $have (npm package $pkg), the release is $VERSION."
            exit 1
          fi

      # Asked without credentials, for up to five minutes: the registry reads the same URL.
      - name: npm serves the new version with its mcpName
        run: |
          set -euo pipefail
          want="$(jq -r .name server.json)"
          for _ in $(seq 1 30); do
            got="$(curl -fsS "https://registry.npmjs.org/mcp-patchbay/$VERSION" | jq -r '.mcpName // empty' || true)"
            if [ "$got" = "$want" ]; then echo "npm serves mcp-patchbay@$VERSION with mcpName $got"; exit 0; fi
            sleep 10
          done
          echo "::error::npm did not serve mcp-patchbay@$VERSION with mcpName $want within five minutes."
          exit 1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Sign in to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish server.json
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'

  # The GitHub Release, only once the same version is on npm, with the bundle attached. The
  # notes are the matching section of CHANGELOG.md (`## <version> - <date>`), or GitHub's
  # generated notes when the tag has none.
  release:
    name: GitHub release
    needs: [guard, npm, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # creating the release
      id-token: write # the OIDC token Sigstore signs the bundle's provenance attestation with
      attestations: write # storing that attestation, for `gh attestation verify`
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: ${{ runner.temp }}/bundle

      # A build provenance attestation on the bundle, signed through Sigstore with this job's
      # OIDC identity. The README says how to check it with `gh attestation verify`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/bundle/mcp-patchbay-${{ needs.guard.outputs.version }}.mcpb

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            /^## / { cap = (index($0, "## " v " ") == 1 || $0 == "## " v); next }
            cap { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      # The attestation's Sigstore bundle goes on the release beside the .mcpb it covers, so
      # it can be checked with `gh attestation verify --bundle` without GitHub's API.
      - name: Create the GitHub Release
        env:
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists."
            exit 1
          fi
          # A prerelease version is a GitHub prerelease too, never marked latest.
          flags=(--verify-tag --title "mcp-patchbay $TAG")
          case "$VERSION" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          bundle="$RUNNER_TEMP/bundle/mcp-patchbay-$VERSION.mcpb"
          if [ ! -s "$bundle" ]; then
            echo "::error::the bundle artifact has no mcp-patchbay-$VERSION.mcpb."
            exit 1
          fi
          if [ ! -s "$ATTESTATION" ]; then
            echo "::error::the attestation step wrote no bundle."
            exit 1
          fi
          attestation="$RUNNER_TEMP/mcp-patchbay-$VERSION.mcpb.sigstore.json"
          cp "$ATTESTATION" "$attestation"
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "$TAG" "${flags[@]}" --notes-file "$RUNNER_TEMP/release-notes.md" "$bundle" "$attestation"
          else
            gh release create "$TAG" "${flags[@]}" --generate-notes "$bundle" "$attestation"
          fi
