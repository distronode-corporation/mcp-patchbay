name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5 # TODO-PIN-SHA
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4 # TODO-PIN-SHA
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4 # TODO-PIN-SHA
        with:
          category: /language:${{ matrix.language }}
