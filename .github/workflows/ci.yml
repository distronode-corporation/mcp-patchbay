name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5 # TODO-PIN-SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # TODO-PIN-SHA
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - uses: actions/setup-python@v5 # TODO-PIN-SHA
        with:
          python-version: '3.12'
      - name: write-gate example tests
        run: python -m unittest discover -s examples/write-gate -v
